      max_output_bytes: 33554432
      max_internal_retry_delay_seconds: 120
      live_sessions: true
      auto_approve: true
      sandbox: workspace-write
      permission_mode: acceptEdits
      dangerously_skip_permissions: false
      sandbox_enabled: false
      agent_by_capability:
        decompose: ai-architect
        review: ai-reviewer
