    max_complexity_by_capability:
      implement: 50
      review: 75
      fix_review: 55
      decompose: 80
    target: local-ollama
  opencode-zen-free:
    runtime: native-opencode
    enabled: true
    capabilities:
    - decompose
    - review
    priority: 160
    capability_weight: 65
    max_complexity: 65
    concurrency_group: opencode-zen-free
    policy:
      timeout_seconds: 1800
      inactivity_timeout_seconds: 300
      output_silence_timeout_seconds: 300
      first_output_timeout_seconds: 120
      max_output_bytes: 16777216
      max_internal_retry_delay_seconds: 120
      live_sessions: true
      auto_approve: false
      sandbox: workspace-write
      permission_mode: acceptEdits
      dangerously_skip_permissions: false
      sandbox_enabled: false
      agent_by_capability:
