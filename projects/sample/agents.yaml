schema_version: 4
runtimes:
  native-codex:
    kind: native
    adapter: codex
    binary: codex
  native-claude-code:
    kind: native
    adapter: claude-code
    binary: claude
  native-antigravity-cli:
    kind: native
    adapter: antigravity-cli
    binary: agy
  native-opencode:
    kind: native
    adapter: opencode
    binary: opencode
  openclaw-local:
    kind: openclaw
    mode: managed
    gateway: ws://127.0.0.1:18789
    version_policy: pinned-compatible
    auth_kind: token
    auth_ref: env:OPENCLAW_GATEWAY_TOKEN
execution_targets:
  gpu-node-a:
    kind: inference_endpoint
    endpoint: http://192.0.2.10:11434/v1
    concurrency_group: gpu-node-a
  gpu-node-b:
    kind: inference_endpoint
    endpoint: http://192.0.2.11:11434/v1
    concurrency_group: gpu-node-b
  local-ollama:
    kind: local
    endpoint: http://127.0.0.1:11434/v1
    concurrency_group: local-ollama
model_routes:
  model-ollama-gpu-a-qwen3-coder-30b-32k:
    provider: ollama
    model: qwen3-coder:30b-32k
    provider_alias: ollama-gpu-a
    endpoint: http://192.0.2.10:11434/v1
    api_family: openai-compatible
    context_window: 32768
    default_target: gpu-node-a
  model-ollama-gpu-b-qwen3-coder-30b-32k:
    provider: ollama
    model: qwen3-coder:30b-32k
    provider_alias: ollama-gpu-b
    endpoint: http://192.0.2.11:11434/v1
    api_family: openai-compatible
    context_window: 32768
    default_target: gpu-node-b
  model-ollama-local-qwen3-coder-30b-32k:
    provider: ollama
    model: qwen3-coder:30b-32k
    provider_alias: ollama-local
    endpoint: http://127.0.0.1:11434/v1
    api_family: openai-compatible
    context_window: 32768
    default_target: local-ollama
  model-opencode-big-pickle:
    provider: opencode
    model: big-pickle
  model-opencode-go-glm-5-2:
    provider: opencode-go
    model: glm-5.2
agents:
  codex:
    runtime: native-codex
    enabled: true
    capabilities:
    - decompose
    - fix_review
    - implement
    - review
    - supervise
    priority: 400
    capability_weight: 100
    max_complexity: 100
    concurrency_group: codex
    policy:
      timeout_seconds: 3600
      inactivity_timeout_seconds: 900
      output_silence_timeout_seconds: 0
      first_output_timeout_seconds: 0
      max_output_bytes: 67108864
      max_internal_retry_delay_seconds: 120
      live_sessions: true
      auto_approve: false
      sandbox: workspace-write
      permission_mode: acceptEdits
      dangerously_skip_permissions: false
      sandbox_enabled: false
    capability_weights:
      decompose: 100
      supervise: 100
    max_complexity_by_capability:
      decompose: 100
      supervise: 100
  claude-code:
    runtime: native-claude-code
    enabled: true
    capabilities:
    - decompose
    - fix_review
    - implement
    - review
    - supervise
    priority: 300
    capability_weight: 95
    max_complexity: 100
    concurrency_group: claude-code
    policy:
      timeout_seconds: 3600
      inactivity_timeout_seconds: 900
