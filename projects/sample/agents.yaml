scheduling:
  automatic_recovery: true
  rotate_agents: true
  minimum_read_only_enforcement: provider_policy
  allow_cross_package_progress: true
  agent_wait_poll_max_seconds: 300
  agent_known_deadline_poll_max_seconds: 1800
  blocking_agent_wait_max_seconds: 1800
  prefer_capable_agents: true
  complexity_medium_threshold: 45
  complexity_high_threshold: 70
  capability_weight_band: 15
  decomposition:
    enabled: true
    complexity_threshold: 60
    target_shard_complexity: 40
    maximum_shard_complexity: 55
    maximum_shards: 8
    trigger_when_no_eligible_provider: true
  parallel_shards:
    enabled: true
    max_workers: 3
    stages:
    - implement
    - review
    - fix_review
    require_disjoint_repositories_for_writes: true
  recovery_playbooks:
    enabled: true
    review_exhausted:
      enabled: true
      max_rescue_cycles: 2
      max_findings: 32
      prefer_non_supervisor_fixer: true
      allow_supervisor_fallback: false
  interactive_console:
    enabled: true
    max_input_event_bytes: 8192
    max_pending_input_bytes: 65536
    default_rows: 40
    default_columns: 120
  scope_recovery:
    max_resume_attempts: 2
    prefer_reviewer: true
    allow_implementer_fallback: true
    allow_cross_repository: true
    cleanup_untracked_artifacts: true
    cleanup_patterns:
    - __pycache__/**
    - '**/__pycache__/**'
    - '*.pyc'
    - '**/*.pyc'
    - '*.pyo'
    - '**/*.pyo'
    - .pytest_cache/**
    - '**/.pytest_cache/**'
    - .mypy_cache/**
    - '**/.mypy_cache/**'
    - .ruff_cache/**
    - '**/.ruff_cache/**'
    max_files: 64
    max_repositories: 8
    max_changed_lines: 10000
    max_excerpt_bytes: 120000
  scope_policy:
    enabled: true
    max_files: 8
    max_changed_lines: 800
    allow_tests: true
    allow_verification_docs: true
    allow_package_metadata: true
    allow_adjacent_source: true
    deny_patterns:
    - .github/**
    - '**/.github/**'
    - PLAN.md
    - BRIEF.md
    - TASK.yaml
    - '**/PLAN.md'
    - '**/BRIEF.md'
    - '**/TASK.yaml'
    - pyproject.toml
    - '**/pyproject.toml'
    - package-lock.json
    - '**/package-lock.json'
    - Cargo.lock
    - '**/Cargo.lock'
    - '**/security/**'
supervisor:
  enabled: true
  agents:
  - codex
  - claude-code
  skill: ai-supervise
  max_attempts_per_incident: 3
  max_agent_delegations: 6
  max_delegation_rounds: 2
  max_runtime_minutes: 60
  ask_human_when_uncertain: false
  require_human_for_destructive_actions: false
  auto_decision:
    enabled: true
    minimum_weight: 45
    minimum_margin: 5
    max_per_incident: 2
commit:
  mode: automatic
  allow_verified_noop: true
