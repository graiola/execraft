      sandbox_enabled: false
      agent_by_capability:
        decompose: ai-architect
        review: ai-reviewer
        fix_review: ai-fixer
      format_repair_agent: ai-contract
    name: ollama_local_coder
    model_route: model-ollama-local-qwen3-coder-30b-32k
    capability_weights:
      implement: 60
