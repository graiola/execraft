name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install 'build>=1.2'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          import os

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match project version {expected!r}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Smoke-test installed wheel outside checkout
        run: |
          python -m venv /tmp/execraft-release
          /tmp/execraft-release/bin/python -m pip install dist/execraft-*.whl
          cd /tmp
          /tmp/execraft-release/bin/execraft --help >/dev/null
          /tmp/execraft-release/bin/execraft doctor
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish to PyPI with trusted publishing
        if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
