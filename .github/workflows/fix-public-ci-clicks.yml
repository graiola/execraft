name: Repair browser click semantics

on:
  push:
    paths:
      - ".github/workflows/fix-public-ci-clicks.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python tools/_ci_click_semantics_repair.py
      - name: Commit repaired tests
        run: |
          rm tools/_ci_click_semantics_repair.py .github/workflows/fix-public-ci-clicks.yml
          git config user.name "Gennaro Raiola"
          git config user.email "gennaro.raiola@gmail.com"
          git add -A
          git commit -m "Isolate browser scroll-preservation assertions"
          git push origin HEAD:main
