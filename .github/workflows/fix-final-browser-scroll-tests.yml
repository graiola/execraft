name: Fix final browser scroll tests

on:
  push:
    paths:
      - ".github/workflows/fix-final-browser-scroll-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct Playwright click semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_gui_browser.py")
          text = path.read_text(encoding="utf-8")

          old_health = '        opener = page.locator("#executionHealthDrawerOpen")\n        opener.click()\n        assert page.locator("#executionHealthDrawerClose").evaluate('
          new_health = '        opener = page.locator("#executionHealthDrawerOpen")\n        # Use a DOM click so Playwright does not scroll the off-screen opener\n        # before Execraft receives the event.\n        opener.evaluate("node => node.click()")\n        assert page.locator("#executionHealthDrawerClose").evaluate('
          if text.count(old_health) != 1:
              raise SystemExit(f"expected one health target, found {text.count(old_health)}")
          text = text.replace(old_health, new_health)

          old_inspector = '        page.locator(\'[data-work-package-action="select"][data-id="F"]\').click()\n        page.locator("#workPackageInspector").wait_for(state="visible")\n        assert _workflow_viewport_position(page) == before'
          new_inspector = '        # Use a DOM click so Playwright actionability does not alter the\n        # viewport baseline before the application handles selection.\n        page.locator(\'[data-work-package-action="select"][data-id="F"]\').evaluate(\n            "node => node.click()"\n        )\n        page.locator("#workPackageInspector").wait_for(state="visible")\n        assert _workflow_viewport_position(page) == before'
          if text.count(old_inspector) != 1:
              raise SystemExit(f"expected one inspector target, found {text.count(old_inspector)}")
          text = text.replace(old_inspector, new_inspector)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit correction and remove helper workflow
        run: |
          rm .github/workflows/fix-final-browser-scroll-tests.yml
          git config user.name "Gennaro Raiola"
          git config user.email "gennaro.raiola@gmail.com"
          git add tests/test_gui_browser.py .github/workflows/fix-final-browser-scroll-tests.yml
          git commit -m "Isolate Playwright scroll-preservation checks"
          git push origin HEAD:main
