name: Fix execution health focus return

on:
  push:
    paths:
      - ".github/workflows/fix-execution-health-focus.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch focus-return fallback
        run: >-
          python -c 'from pathlib import Path; p=Path("src/execraft/assets/gui/execution-health-view.js"); s=p.read_text(encoding="utf-8"); old="    this.lastTrigger = document.activeElement instanceof HTMLElement ? document.activeElement : this.openButton;"; new="    const active = document.activeElement;\n    this.lastTrigger =\n      active instanceof HTMLElement &&\n      active !== document.body &&\n      active !== document.documentElement\n        ? active\n        : this.openButton;"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1), encoding="utf-8")'
      - name: Validate JavaScript
        run: node --check src/execraft/assets/gui/execution-health-view.js
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-execution-health-focus.yml
          git config user.name "Gennaro Raiola"
          git config user.email "gennaro.raiola@gmail.com"
          git add src/execraft/assets/gui/execution-health-view.js .github/workflows/fix-execution-health-focus.yml
          git commit -m "Restore execution health focus deterministically"
          git push origin HEAD:main
