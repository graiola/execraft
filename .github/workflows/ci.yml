name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install quality tools
        run: python -m pip install -e '.[test,quality]'
      - name: Run mandatory local/CI preflight
        run: python tools/preflight.py
      - name: Type-check the gradual typed core
        run: mypy
      - name: Check browser JavaScript syntax
        run: find src/execraft/assets/gui -name '*.js' -print0 | xargs -0 -n1 node --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run non-browser suite
        run: python -m pytest -q --ignore=tests/test_gui_browser.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install 'build>=1.2'
          python -m build
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/execraft-wheel
          /tmp/execraft-wheel/bin/python -m pip install dist/execraft-*.whl
          cd /tmp
          /tmp/execraft-wheel/bin/execraft --help
          /tmp/execraft-wheel/bin/python - <<'PY'
          from importlib import resources
          import execraft
          assert execraft.__version__ == "0.1.0"
          assert (resources.files("execraft") / "assets" / "gui" / "index.html").is_file()
          assert (resources.files("execraft") / "py.typed").is_file()
          print(execraft.__file__)
          PY
      - name: Run installed-control-plane acceptance test
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_installable_control_plane.py
