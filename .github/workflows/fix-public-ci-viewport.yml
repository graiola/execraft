name: Repair viewport CI regressions

on:
  push:
    paths:
      - ".github/workflows/fix-public-ci-viewport.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python tools/_ci_viewport_repair.py
      - name: Commit repaired sources and tests
        run: |
          rm tools/_ci_viewport_repair.py .github/workflows/fix-public-ci-viewport.yml
          git config user.name "Gennaro Raiola"
          git config user.email "gennaro.raiola@gmail.com"
          git add -A
          git commit -m "Preserve GUI viewport across inspectors"
          git push origin HEAD:main
